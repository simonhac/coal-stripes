"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# `bun install` bootstraps deps (incl. @simon/workspace-env) before the wrapper imports it.
# `npx --yes tsx` avoids the install-prompt deadlock in a fresh worktree (LiveOne#355).
setup = "bun install && npx --yes tsx env/setup.mts"
run_mode = "concurrent"

[scripts.run.dev]
command = "npx --yes tsx env/run.mts"
default = true
icon = "play"

[scripts.run.test]
command = "npm run test:watch"
icon = "test-tube"
