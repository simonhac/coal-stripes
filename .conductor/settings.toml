"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# `npm install` bootstraps deps (incl. @simon/workspace-env) before the wrapper
# imports it; then the identical wrapper runs env/workspace.config.yaml's phases.
setup = "npm install && npx tsx env/setup.mts"
run_mode = "concurrent"

[scripts.run.dev]
command = "npx tsx env/run.mts"
default = true
icon = "play"

[scripts.run.test]
command = "npm run test:watch"
icon = "test-tube"
